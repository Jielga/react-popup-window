name: Bootstrap publish

# ONE-TIME workflow. Delete it once it has succeeded.
#
# npm cannot configure a trusted publisher for a package that does not exist
# yet, and @jielga/react-popup-window has never been published - so the very
# first version cannot come from the OIDC-authenticated Release workflow. This
# job publishes it with a short-lived npm token instead.
#
# Run it manually, then:
#   1. On npmjs.com, add this repo + `release.yml` as the package's trusted
#      publisher.
#   2. Delete the NPM_TOKEN secret and this file.
# From then on Release publishes every version with no token at all.
# See RELEASING.md.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run skills:validate

      - run: npm test

      # `prepublishOnly` builds dist/ from this commit.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
